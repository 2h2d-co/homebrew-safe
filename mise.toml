[tools]
hk = { version = "2.4.0", postinstall = "hk install --mise" }
betterleaks = "1.9.0"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
shfmt = "3.14.1"
shellcheck = "0.11.0"
ruby = "4.0.7"

[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tasks.test]
description = "Run Ruby unit tests"
run = "ruby -Ilib:test -e 'Dir[\"test/**/*_test.rb\"].sort.each { |file| require_relative file }'"

[tasks."test:homebrew"]
description = "Check command subprocess integration without changing packages"
run = "HOMEBREW_NO_AUTO_UPDATE=1 brew ruby -- test/homebrew_subprocess.rb"

[tasks.check]
description = "Run all non-writing project checks"
run = ["hk check --all --check", "mise run test", "mise run test:homebrew"]
