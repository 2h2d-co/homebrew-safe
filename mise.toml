[tools]
hk = { version = "2.10.0", workflow = "release.yml", postinstall = "hk install --mise" }
betterleaks = "1.9.0"
cocogitto = "7.0.0"
jactionlint = "2.3.0"
zizmor = "1.30.1"
shfmt = "3.14.1"
shellcheck = "0.11.0"
ruby = "4.0.9"

[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tasks.test]
description = "Run Ruby unit tests"
run = "ruby -Ilib:test -e 'Dir[\"test/**/*_test.rb\"].sort.each { |file| require_relative file }'"

[tasks."test:homebrew"]
description = "Check command subprocess integration and help without changing packages"
run = [
  "HOMEBREW_NO_AUTO_UPDATE=1 brew ruby -- test/homebrew_subprocess.rb",
  "HOMEBREW_NO_AUTO_UPDATE=1 brew ruby -- test/homebrew_help.rb",
]

[tasks.wrappers]
description = "Regenerate the formula command wrappers in bin/ from the command help"
run = "HOMEBREW_NO_AUTO_UPDATE=1 brew ruby -- script/write-command-wrappers.rb"

[tasks.check]
description = "Run all non-writing project checks"
run = ["hk check --all --check", "mise run test", "mise run test:homebrew"]
