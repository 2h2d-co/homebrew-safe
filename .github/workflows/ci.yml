name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check commands
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.8.2"
          install_args: --locked
          cache: false
      - name: Run shared checks
        run: hk check --all --check
      - name: Run tests
        run: ruby -Ilib:test -e 'Dir["test/**/*_test.rb"].sort.each { |file| require_relative file }'
      - name: Load commands with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew ruby -- -Ilib -e 'Dir["cmd/*.rb"].sort.each { |file| require File.expand_path(file) }'
