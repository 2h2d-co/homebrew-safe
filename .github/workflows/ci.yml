name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check commands
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.2"
          install_args: --locked
          cache: false
      - name: Run shared checks
        run: hk check --all --check
      - name: Run tests
        run: ruby -Ilib:test -e 'Dir["test/**/*_test.rb"].sort.each { |file| require_relative file }'
      - name: Load commands with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew ruby -- -Ilib -e 'Dir["cmd/*.rb"].sort.each { |file| require File.expand_path(file) }'
