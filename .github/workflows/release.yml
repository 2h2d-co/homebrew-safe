name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: homebrew-safe-release
  cancel-in-progress: false
jobs:
  release:
    name: Publish archive
    runs-on: macos-15
    permissions:
      attestations: write # Required to attest release artifacts.
      contents: write # Required to create the GitHub release.
      id-token: write # Required for artifact attestation signing.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.6.14"
          install_args: --locked
          cache: false
      - name: Run shared checks
        run: hk check --all --check
      - name: Run tests
        run: ruby -Ilib:test -e 'Dir["test/**/*_test.rb"].sort.each { |file| require_relative file }'
      - name: Build release archive
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="brew-safe_${version}.tar.gz"
          tar -czf "$archive" cmd lib README.md LICENSE
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_ENV"
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
